<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Tea Hut #1 — Public Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 class="site-title">🍵 Green Tea Hut <span class="title-num">#1</span> 🌿</h1>
      <button type="button" class="wallet-button">Connect Wallet</button>
    </header>

    <main>
      <!-- Hero image — swap src to assets/image/green-tea-party-hut.png once the PNG is added -->
      <section class="hero" aria-label="Green Tea Hut #1 concept art">
        <img
          src="assets/images/green-tea-party-hut.svg"
          alt="Hand-drawn concept sketch of the Green Tea Party Hut #1 — cob walls, living green roof, and round windows"
          class="hero-image"
          width="300"
          height="300"
        />
      </section>

      <!-- Financial equation displayed below the hero image -->
      <section class="equation-section" aria-label="Financial summary">
        <div class="equation">
          <div class="eq-item eq-raised">
            <div class="eq-label">Total Raised</div>
            <div class="eq-value" id="total-raised">Pending sync</div>
          </div>
          <div class="eq-op" aria-hidden="true">−</div>
          <div class="eq-item eq-spent">
            <div class="eq-label">Total Spent</div>
            <div class="eq-value" id="total-spent">Pending sync</div>
          </div>
          <div class="eq-op" aria-hidden="true">=</div>
          <div class="eq-item eq-balance">
            <div class="eq-label">Balance</div>
            <div class="eq-value" id="balance">Pending sync</div>
          </div>
        </div>
        <p class="summary-note">Source: Manual pending entry (until contract deploy)</p>
      </section>

      <!-- Ledger filters -->
      <section class="filters" aria-label="Ledger filters">
        <label>
          Type
          <select id="type-filter">
            <option value="ALL">All</option>
            <option value="INCOMING">Incoming</option>
            <option value="OUTGOING">Outgoing</option>
          </select>
        </label>

        <label>
          Status
          <select id="status-filter">
            <option value="ALL">All</option>
            <option value="PENDING">Pending</option>
            <option value="CONFIRMED">Confirmed</option>
          </select>
        </label>

        <label>
          Search
          <input id="search-filter" type="search" placeholder="Category or description" />
        </label>
      </section>

      <!-- Ledger entries -->
      <section aria-label="Ledger entries">
        <h2 class="ledger-heading">📜 Public Ledger</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Type</th>
                <th>Status</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Description</th>
                <th>Proof</th>
              </tr>
            </thead>
            <tbody id="ledger-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
