<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="earthSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8dce8"/>
      <stop offset="60%" stop-color="#d4ede1"/>
      <stop offset="100%" stop-color="#8bc49a"/>
    </linearGradient>
    <linearGradient id="earthWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a870"/>
      <stop offset="100%" stop-color="#a07848"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aae88"/>
      <stop offset="100%" stop-color="#5a8e68"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#earthSky)"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.7">
    <ellipse cx="120" cy="100" rx="60" ry="25"/>
    <ellipse cx="160" cy="95" rx="50" ry="22"/>
    <ellipse cx="90" cy="105" rx="40" ry="18"/>
    <ellipse cx="620" cy="80" rx="70" ry="28"/>
    <ellipse cx="665" cy="75" rx="55" ry="22"/>
    <ellipse cx="590" cy="88" rx="45" ry="20"/>
  </g>

  <!-- Ground / landscape -->
  <ellipse cx="400" cy="500" rx="500" ry="160" fill="url(#groundGrad)"/>
  <rect x="0" y="400" width="800" height="100" fill="#5a8e68"/>

  <!-- Trees -->
  <g>
    <rect x="95" y="280" width="10" height="80" fill="#5d3e28"/>
    <ellipse cx="100" cy="260" rx="35" ry="50" fill="#2d6e4a"/>
    <ellipse cx="88" cy="275" rx="22" ry="35" fill="#3d7e5a"/>
    <rect x="685" y="285" width="10" height="75" fill="#5d3e28"/>
    <ellipse cx="690" cy="265" rx="35" ry="50" fill="#2d6e4a"/>
    <ellipse cx="710" cy="270" rx="28" ry="42" fill="#3d7e5a"/>
    <rect x="730" y="300" width="8" height="60" fill="#5d3e28"/>
    <ellipse cx="734" cy="283" rx="25" ry="38" fill="#2d6e4a"/>
  </g>

  <!-- Earth-built hut: round/dome shape -->
  <!-- Foundation ring -->
  <ellipse cx="400" cy="390" rx="175" ry="30" fill="#8b6340" opacity="0.6"/>

  <!-- Main dome wall (cob/adobe earth) -->
  <ellipse cx="400" cy="320" rx="170" ry="115" fill="url(#earthWall)"/>

  <!-- Texture lines on wall -->
  <g stroke="#9a7040" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 240 380 Q 260 340 290 310 Q 320 285 360 275"/>
    <path d="M 560 380 Q 540 340 510 310 Q 480 285 440 275"/>
    <path d="M 250 395 Q 280 360 310 335 Q 340 310 375 298"/>
    <path d="M 550 395 Q 520 360 490 335 Q 460 310 425 298"/>
    <path d="M 280 400 Q 305 375 330 355 Q 355 335 385 325"/>
    <path d="M 520 400 Q 495 375 470 355 Q 445 335 415 325"/>
  </g>

  <!-- Living roof / green top -->
  <ellipse cx="400" cy="240" rx="140" ry="55" fill="#5a9e72"/>
  <ellipse cx="400" cy="235" rx="120" ry="42" fill="#6aae82"/>
  <!-- Wildflowers on roof -->
  <g>
    <circle cx="350" cy="230" r="5" fill="#ffe066"/>
    <circle cx="370" cy="222" r="4" fill="#ff8a65"/>
    <circle cx="395" cy="218" r="5" fill="#ffe066"/>
    <circle cx="420" cy="224" r="4" fill="#ff8a65"/>
    <circle cx="440" cy="232" r="5" fill="#ffe066"/>
    <circle cx="330" cy="240" r="4" fill="#f48fb1"/>
    <circle cx="458" cy="240" r="4" fill="#f48fb1"/>
  </g>
  <!-- Grass blades on roof -->
  <g stroke="#4a8e62" stroke-width="2" fill="none">
    <path d="M 345 228 Q 342 215 348 208"/>
    <path d="M 375 220 Q 373 207 379 200"/>
    <path d="M 405 216 Q 403 203 409 196"/>
    <path d="M 435 222 Q 433 209 439 202"/>
    <path d="M 460 232 Q 458 219 464 212"/>
  </g>

  <!-- Door (arched, wooden) -->
  <path d="M 362 390 L 362 330 Q 362 310 400 310 Q 438 310 438 330 L 438 390 Z" fill="#5d3e28"/>
  <path d="M 368 390 L 368 332 Q 368 316 400 316 Q 432 316 432 332 L 432 390 Z" fill="#7a5238"/>
  <!-- Door handle -->
  <circle cx="424" cy="355" r="4" fill="#c8a030"/>

  <!-- Round window left -->
  <circle cx="295" cy="340" r="28" fill="#c8e8d8" stroke="#8b6340" stroke-width="4"/>
  <line x1="295" y1="312" x2="295" y2="368" stroke="#8b6340" stroke-width="2"/>
  <line x1="267" y1="340" x2="323" y2="340" stroke="#8b6340" stroke-width="2"/>

  <!-- Round window right -->
  <circle cx="505" cy="340" r="28" fill="#c8e8d8" stroke="#8b6340" stroke-width="4"/>
  <line x1="505" y1="312" x2="505" y2="368" stroke="#8b6340" stroke-width="2"/>
  <line x1="477" y1="340" x2="533" y2="340" stroke="#8b6340" stroke-width="2"/>

  <!-- Solar panel suggestion on side -->
  <g transform="translate(590,290) rotate(-15)">
    <rect x="0" y="0" width="60" height="40" fill="#4a6080" rx="3"/>
    <line x1="20" y1="0" x2="20" y2="40" stroke="#6a80a0" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="40" stroke="#6a80a0" stroke-width="1"/>
    <line x1="0" y1="15" x2="60" y2="15" stroke="#6a80a0" stroke-width="1"/>
    <line x1="0" y1="28" x2="60" y2="28" stroke="#6a80a0" stroke-width="1"/>
  </g>

  <!-- Garden bed in front -->
  <ellipse cx="400" cy="418" rx="130" ry="22" fill="#8b5e3c"/>
  <g fill="#5a9e72">
    <ellipse cx="310" cy="415" rx="18" ry="10"/>
    <ellipse cx="340" cy="410" rx="15" ry="9"/>
    <ellipse cx="370" cy="412" rx="14" ry="8"/>
    <ellipse cx="400" cy="410" rx="16" ry="9"/>
    <ellipse cx="430" cy="412" rx="14" ry="8"/>
    <ellipse cx="460" cy="415" rx="15" ry="9"/>
    <ellipse cx="490" cy="416" rx="18" ry="10"/>
  </g>
  <!-- Tea plants (small bushes) -->
  <g fill="#3d7e5a">
    <ellipse cx="310" cy="412" rx="12" ry="7"/>
    <ellipse cx="400" cy="408" rx="11" ry="6"/>
    <ellipse cx="490" cy="413" rx="12" ry="7"/>
  </g>

  <!-- Smoke from chimney -->
  <g fill="#d0d8d0" opacity="0.4">
    <circle cx="460" cy="200" r="12"/>
    <circle cx="455" cy="182" r="10"/>
    <circle cx="460" cy="165" r="8"/>
    <circle cx="457" cy="150" r="6"/>
  </g>
  <!-- Chimney -->
  <rect x="450" y="220" width="20" height="30" fill="#9a7040"/>

  <!-- Caption -->
  <rect x="0" y="460" width="800" height="40" fill="#175f3b" opacity="0.75"/>
  <text x="400" y="486" text-anchor="middle" fill="#e8f5e9" font-family="Georgia, serif" font-size="15" letter-spacing="1">Earth-Built Hut — Cob Construction Reference</text>
</svg>
