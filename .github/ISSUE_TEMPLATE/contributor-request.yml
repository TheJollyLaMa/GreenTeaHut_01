name: Contributor Request
description: Request to help Green Tea Hut #1 as a builder or tester
title: "Contributor request: "
labels: ["contributor-request"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us briefly where you can provide technical help. No interview or biography is required.

  - type: input
    id: github
    attributes:
      label: GitHub username
      description: Your GitHub handle
      placeholder: e.g. yourname
    validations:
      required: true

  - type: input
    id: wallet
    attributes:
      label: Wallet address
      description: Ethereum wallet address for ART payouts
      placeholder: 0x...
    validations:
      required: true

  - type: textarea
    id: skills
    attributes:
      label: What you want to help with
      description: Name the technical area or task you want to contribute to.
      placeholder: Frontend, contracts, tooling, testing, research, or a specific issue
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Relevant links / repos / past work
      description: Share relevant projects, repositories, or technical work.
      placeholder: https://github.com/yourname/project
    validations:
      required: false