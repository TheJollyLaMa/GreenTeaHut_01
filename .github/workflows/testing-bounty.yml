name: Testing Bounty Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  handle-command:
    if: >
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/test-complete') || startsWith(github.event.comment.body, '/test-approved'))
    runs-on: ubuntu-latest
    concurrency:
      group: green-tea-hut-payroll-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Process testing command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/processTestingBounty.js
      - name: Validate updated queue
        run: node scripts/validatePayrollQueue.js
      - name: Commit queue update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: queue Base USDC testing payout"
          git push origin HEAD:main
      - name: Rebuild public payroll data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
