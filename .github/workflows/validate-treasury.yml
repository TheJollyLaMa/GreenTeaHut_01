name: Validate project treasury

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/*treasury*'
      - 'scripts/*base*'
      - 'scripts/*snapshot*'
      - 'scripts/export-optimism.js'
      - 'test/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/validate-treasury.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/validate-treasury.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: git diff --exit-code -- artifacts/ProjectTreasuryLedger.json web/treasury-abi.json
      - run: npm test
      - run: node scripts/test-native-decimals.js
      - run: node scripts/test-payout-mvp.js
      - run: node scripts/validate-abi.js
